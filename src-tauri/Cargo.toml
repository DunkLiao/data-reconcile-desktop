[package]
name = "csv-compare"
version = "1.0.0"
description = "CSV Compare Desktop Tool"
authors = ["CSVCompare"]
edition = "2021"

[lib]
name = "csv_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
encoding_rs = "0.8"
chardetng = "0.1"
rust_xlsxwriter = "0.87"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
